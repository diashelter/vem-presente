bind 0.0.0.0
protected-mode yes
port 6379

appendonly yes
appendfsync everysec

maxmemory 256mb
maxmemory-policy allkeys-lru

# A senha (requirepass) é passada via linha de comando no docker-compose,
# usando a variável REDIS_PASSWORD do .env — não fica hardcoded aqui para
# permitir senhas diferentes por ambiente sem versionar segredo neste arquivo.
